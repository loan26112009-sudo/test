<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCut Silence</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header id="header">
    <div class="logo-icon">✂</div>
    <div class="logo-text"><span class="brand">AutoCut Silence</span></div>
  </header>

  <div id="content">

    <!-- Statut -->
    <div id="status-bar">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text">Prêt !</span>
    </div>
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>

    <!-- Preset -->
    <div class="section-label">Comment couper ?</div>
    <div class="preset-grid">
      <button class="preset-btn" data-preset="soft">
        <span class="preset-icon">🌿</span>
        <span class="preset-name">Doux</span>
        <span class="preset-desc">Garde les petites pauses naturelles</span>
      </button>
      <button class="preset-btn active" data-preset="balanced">
        <span class="preset-icon">⚡</span>
        <span class="preset-name">Équilibré</span>
        <span class="preset-desc">Le meilleur réglage pour la plupart des vidéos</span>
      </button>
      <button class="preset-btn" data-preset="hard">
        <span class="preset-icon">🔥</span>
        <span class="preset-name">Agressif</span>
        <span class="preset-desc">Coupe tout, même les micro-silences</span>
      </button>
    </div>

    <!-- Waveform + Aperçu -->
    <button id="btn-preview" class="btn btn-preview">
      ▶ &nbsp;Générer l'Aperçu
    </button>

    <div id="waveform-container">
      <canvas id="waveform-canvas"></canvas>
      <div id="waveform-placeholder">
        <span class="wph-icon">🎵</span>
        <span>L'aperçu audio apparaîtra ici</span>
      </div>
    </div>

    <div id="silence-stats"></div>

    <!-- Pistes (s'affichent dynamiquement après analyse) -->
    <div id="tracks-section" style="display:none">
      <div class="section-label">Pistes à couper</div>
      <div id="track-pills"></div>
    </div>

    <!-- Sécurité -->
    <div id="safety-row">
      <div class="safety-icon">🛡️</div>
      <div class="safety-text">
        <strong>Travailler sur une copie</strong>
        <span>Ton montage original reste intact</span>
      </div>
      <label class="toggle">
        <input type="checkbox" id="use-copy" checked>
        <span class="toggle-track"></span>
      </label>
    </div>

  </div>

  <footer id="footer">
    <button id="btn-apply" class="btn btn-apply" disabled>
      ✂ &nbsp;Couper les Silences
    </button>
  </footer>

</div>

<div id="toast"></div>

<script src="js/CSInterface.js"></script>
<script src="js/main.js"></script>
</body>
</html>
